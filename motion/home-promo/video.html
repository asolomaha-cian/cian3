<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Циан помогает въехать · 15 секунд</title>
<link rel="stylesheet" href="brand/brand.css">
<link rel="stylesheet" href="base.css">
<style>
#frame{background:#f5f7fc}
.backdrop{position:absolute;right:-370px;top:-200px;width:1230px;height:1480px;border-radius:50%;background:linear-gradient(155deg,#e6edff 0%,#eef2ff 62%,#dce6ff 100%);transform:rotate(-15deg)}
.brand{position:absolute;left:136px;top:101px;display:flex;align-items:center;gap:38px;z-index:2}
.brand img{width:177px;height:auto}
.brand span{font-size:20px;color:#737a8e;border-left:1px solid #d8deec;padding-left:29px;line-height:32px}
.copy{position:absolute;left:136px;top:292px;width:940px;z-index:2}
.eyebrow{font-size:18px;line-height:26px;letter-spacing:3px;font-weight:700;color:var(--accent);margin-bottom:34px}
.copy h1{font-size:108px;line-height:1.08;letter-spacing:-4.6px;font-weight:700}
.copy h1 span{color:var(--accent)}
.copy p{font-size:25px;line-height:38px;color:#737a8e;margin-top:33px;letter-spacing:-.3px}
#copy-intro h1{font-size:132px;line-height:1.03;letter-spacing:-6px}
#copy-recommend h1,#copy-resume h1{font-size:87px;line-height:1.13;letter-spacing:-3.3px}
#copy-final{top:315px}
#copy-final h1{font-size:106px;line-height:1.12;letter-spacing:-4.2px}
.steps{position:absolute;left:136px;bottom:129px;z-index:2;width:820px}
.step-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:18px;letter-spacing:.7px;color:#737a8e}
.step-label b{color:var(--ink);font-weight:600}
.step-lines{display:flex;gap:10px}
.step-line{height:3px;background:#dce2ef;width:100%;overflow:hidden;border-radius:2px}
.step-line i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
#app{box-shadow:none;border-radius:0;background:transparent;overflow:visible}
#app2{border-radius:0;overflow:visible}
#phone{position:absolute;inset:0;width:1920px;height:1080px}
#sources{display:none}
.hit{position:absolute;pointer-events:none}
#subL,#titleL{display:none!important}
.rip{background:rgba(0,84,253,.16);border:2px solid rgba(0,84,253,.5)}
</style>
<script src="plan.js"></script><script src="cues.js"></script><script src="tmap.js"></script>
<script src="assets/capture.js"></script><script src="engine.js"></script>
</head>
<body>
<div id="frame">
  <div class="backdrop"></div>
  <header class="brand"><img src="brand/logos/wordmark.svg" alt="Циан"><span>Мобильная главная</span></header>
  <section class="copy" id="copy-intro"><div class="eyebrow">НОВАЯ ГЛАВНАЯ</div><h1>Найдите<br><span>своё.</span></h1><p>Купить · Снять · Новостройки</p></section>
  <section class="copy" id="copy-recommend"><div class="eyebrow">РЕКОМЕНДАЦИИ</div><h1>Выбирайте то,<br>что <span>подходит.</span></h1><p>Уточняйте подборку прямо на главной</p></section>
  <section class="copy" id="copy-resume"><div class="eyebrow">СОХРАНЁННЫЙ ПОИСК</div><h1>Продолжайте<br><span>с того же места.</span></h1><p>Ваши параметры уже на месте</p></section>
  <section class="copy" id="copy-final"><div class="eyebrow">НОВАЯ ГЛАВНАЯ ЦИАНА</div><h1>Циан помогает<br><span>въехать</span></h1></section>
  <div class="steps" id="steps"><div class="step-label"><b id="step-name">Поиск</b><span id="step-count">01 / 03</span></div><div class="step-lines"><div class="step-line"><i id="line-0"></i></div><div class="step-line"><i id="line-1"></i></div><div class="step-line"><i id="line-2"></i></div></div></div>
  <div id="stage" class="layer"><div id="app">
    <canvas id="phone" width="1920" height="1080" aria-label="Реальные экраны мобильного прототипа"></canvas>
    <div id="sources">
      <img id="page-new" src="assets/home-new.jpg" alt="Первый визит"><img id="nav-new" src="assets/home-new-nav.png" alt="">
      <img id="page-metro" src="assets/home-metro.jpg" alt="Подборка у метро"><img id="nav-metro" src="assets/home-metro-nav.png" alt="">
      <img id="page-returning" src="assets/home-returning.jpg" alt="Сохранённый поиск"><img id="nav-returning" src="assets/home-returning-nav.png" alt="">
      <img id="page-results" src="assets/search-results.jpg" alt="Выдача с сохранёнными параметрами">
    </div>
    <div id="filter-hit" class="hit"></div><div id="resume-hit" class="hit"></div>
  </div></div>
  <div id="stage2" class="layer"><div id="app2"></div></div>
</div>
<script>
const C = window.CAPTURE;
const SCROLL = 190;
function scaleAt(t){
  const k=(a,b)=>E.eio(E.lin(t,a,b));
  return 1.01+.025*k(0,1.8)+.095*k(1.8,3.6)-.11*k(6.6,7.35)+.1*k(7.35,8.6)-.08*k(8.6,9.6)-.03*k(11.55,12.55);
}
function pointAt(t,x,y){const s=scaleAt(t);return {x:1395+(x-195)*s,y:540+(y-422)*s};}
function drawPhone(t){
  const {$,eio,lin}=E,ctx=$('phone').getContext('2d');
  ctx.clearRect(0,0,1920,1080);
  const s=scaleAt(t),p=pointAt(t,0,0);
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.shadowColor='#2448a12a';ctx.shadowBlur=55;ctx.shadowOffsetY=22;
  ctx.beginPath();ctx.roundRect(-9,-9,408,862,39);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.beginPath();ctx.roundRect(0,0,390,844,30);ctx.clip();
  const returned=eio(lin(t,6.88,7.2)),final=eio(lin(t,11.92,12.3));
  function screen(name,alpha,scroll){
    if(alpha<=0)return;
    const img=$('page-'+name);ctx.globalAlpha=alpha;
    ctx.fillStyle='#fcfcff';ctx.fillRect(0,0,390,844);
    ctx.drawImage(img,0,-scroll,390,img.naturalHeight/2);
    if(name!=='results'){
      const r=C.screens['home-'+name].tabbar;
      ctx.drawImage($('nav-'+name),r.x,r.y,r.width,r.height);
    }
  }
  screen('new',1,SCROLL*eio(lin(t,2.65,3.55))*(1-final));
  screen('metro',eio(lin(t,4.42,4.58))*(1-returned)*(1-final),SCROLL);
  screen('returning',returned*(1-final),0);
  screen('results',eio(lin(t,9.28,9.55))*(1-final),360*eio(lin(t,10.05,10.85)));
  ctx.restore();
}
E.start({
  build(E){
    const f=C.filter_target,r=C.resume_target;
    const fp=pointAt(4.4,f.x+f.width/2,f.y+f.height/2-SCROLL);
    const rp=pointAt(9.2,r.x+r.width/2,r.y+r.height/2);
    E.css(E.$('filter-hit'),{left:fp.x+'px',top:fp.y+'px',width:'0px',height:'0px'});
    E.css(E.$('resume-hit'),{left:rp.x+'px',top:rp.y+'px',width:'0px',height:'0px'});
  },
  setup(E){
    E.measureAt(4.4);
    const f=E.rect('filter-hit'),r=E.rect('resume-hit');
    E.camera([[0,960,540,1],[15,960,540,1]],[]);
    E.cursor([
      [0,f.cx+50,f.cy+80,0],[3.65,f.cx+50,f.cy+80,0],
      [4.15,f.cx,f.cy,1],[4.7,f.cx,f.cy,1],[5.1,f.cx+35,f.cy+60,0],
      [7.9,r.cx+60,r.cy+70,0],[8.65,r.cx,r.cy,1],
      [9.35,r.cx,r.cy,1],[9.7,r.cx+40,r.cy+55,0],[15,r.cx+40,r.cy+55,0]
    ]);
    E.clicks([4.4,9.2]);
  },
  scene(t,E){
    const {$,css,lin,eio,env}=E;
    const final=eio(lin(t,11.92,12.3));
    drawPhone(t);
    const intervals=[[-1,3.05],[2.93,7.06],[7.0,12.02],[11.96,17]];
    ['intro','recommend','resume','final'].forEach((name,i)=>{
      const [a,b]=intervals[i],p=env(t,a,b,.32,.22);
      css($('copy-'+name),{opacity:p,transform:`translateY(${20*(1-eio(lin(t,a,a+.42)))}px)`});
    });
    const chapter=t<3?0:t<7?1:2;
    $('step-name').textContent=['Поиск','Рекомендации','Продолжение поиска'][chapter];
    $('step-count').textContent='0'+(chapter+1)+' / 03';
    css($('steps'),{opacity:1-final});
    const spans=[[0,3],[3,7],[7,12]];
    spans.forEach(([a,b],i)=>css($('line-'+i),{transform:`scaleX(${lin(t,a,b)})`}));
  }
});
</script>
</body></html>
